name: MOHIT.OS - Build and refresh profile
on:
  push:
    branches: [feature/mohit-os-redesign]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: mohit-os-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build-pull-request:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref_name == 'feature/mohit-os-redesign')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh contribution and repository metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/update_profile_metrics.py
      - name: Render and validate MOHIT.OS
        run: python scripts/mohit_os.py --render --validate
      - name: Commit generated assets to the PR branch only
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json assets/activity/contributions.json assets/activity/github-stats.svg assets/activity/top-languages.svg assets/boot assets/identity assets/world assets/profile assets/living-machine assets/telemetry assets/achievements assets/shutdown
          if git diff --cached --quiet; then
            echo "Generated assets are already current."
          else
            git commit -m "chore: generate MOHIT.OS profile assets"
            git push origin "HEAD:$HEAD_BRANCH"
          fi
  scheduled-refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main for scheduled data refresh
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh contribution and repository metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/update_profile_metrics.py
      - name: Render and validate MOHIT.OS
        run: python scripts/mohit_os.py --render --validate
      - name: Open refresh PR instead of pushing to main
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/mohit-os-refresh
          base: main
          delete-branch: true
          commit-message: "chore: refresh MOHIT.OS profile data"
          title: "chore: refresh MOHIT.OS profile data"
          body: |
            Automated refresh of public GitHub contribution metrics and generated MOHIT.OS artwork.
            This PR is opened for review. It never merges itself or pushes generated commits directly to main.
          add-paths: |
            data/profile.json
            assets/activity/contributions.json
            assets/activity/github-stats.svg
            assets/activity/top-languages.svg
            assets/boot/**
            assets/identity/**
            assets/world/**
            assets/profile/**
            assets/living-machine/**
            assets/telemetry/**
            assets/achievements/**
            assets/shutdown/**
