name: Update GitHub profile activity

on:
  push:
    branches: [main]
    paths:
      - "scripts/render_contribution_nebula.py"
      - "scripts/update_profile_metrics.py"
      - ".github/workflows/update-profile-activity.yml"
  schedule:
    # 05:30 IST (00:00 UTC) every day
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-update
  cancel-in-progress: false

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: python -m pip install --upgrade pip pillow numpy

      - name: Fetch contribution data and render live cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/update_profile_metrics.py

      - name: Render 3D Contribution Nebula
        run: python scripts/render_contribution_nebula.py

      - name: Commit updated generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity/contributions.json assets/activity/contrib-3d.gif assets/activity/contrib-3d-static.png assets/activity/github-stats.svg assets/activity/top-languages.svg
          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
          else
            git commit -m "chore: refresh GitHub profile activity"

            # Rebase generated changes on the latest main before pushing.
            # Retry in case another commit lands between fetch and push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main

              if git push origin HEAD:main; then
                echo "Successfully pushed profile activity updates."
                exit 0
              fi

              echo "Push attempt $attempt failed; retrying with the latest main."
            done

            echo "Unable to push after 3 attempts."
            exit 1
          fi
